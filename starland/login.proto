syntax = "proto3";

package starland;

option go_package = "github.com/ttufo101/api/starland;starland";

service Login {
  // 邮箱密码注册
  rpc Register (RegisterRequest) returns (LoginResponse);

  // 邮箱密码登录
  rpc Login (LoginRequest) returns (LoginResponse);

  // 长 token 刷新长短 token
  rpc RefreshToken (RefreshTokenRequest) returns (LoginResponse);

  // 校验邮箱验证码
  rpc GetRestToken (GetRestTokenRequest) returns (GetRestTokenResponse);

  // 使用邮箱验证码重置密码
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse);
}

message RegisterRequest {
  string email = 1;     // 登录邮箱，服务端会归一化为小写。
  string password = 2;  // 登录密码。
  string code = 3;      // 注册邮箱验证码。
}

message LoginRequest {
  string email = 1;     // 登录邮箱，服务端会归一化为小写。
  string password = 2;  // 登录密码。
}

message LoginResponse {
  string uid = 1;                 // 用户ID，使用 uidflake 生成的 base62 字符串。
  string access_token = 2;        // 短 token，用于访问受保护接口。
  string refresh_token = 3;       // 长 token，用于刷新登录态。
  int64 access_expire_at = 4 [json_name = "access_expire_at", jstype = JS_NUMBER];     // 短 token 过期时间，Unix 秒级时间戳。
  int64 refresh_expire_at = 5 [json_name = "refresh_expire_at", jstype = JS_NUMBER];    // 长 token 过期时间，Unix 秒级时间戳。
}

message RefreshTokenRequest {
  string refresh_token = 1;  // 长 token。
}

message ResetPasswordRequest {
  string email = 1;         // 已注册的登录邮箱。
  string new_password = 2;  // 新登录密码。
  string rest_token = 3;          // 邮箱验证码。
}

message ResetPasswordResponse {
  bool success = 1;  // 是否成功重置密码。
}



message GetRestTokenRequest {
  string email = 1;  // 接收验证码的邮箱地址，须与发送时一致；大小写不敏感。
  string scene = 2;  // 验证码业务场景标识，须与发送时一致；login 服务使用 register（注册）和 pwd_recovery（找回密码）。
  string code = 3;   // 用户收到的邮箱验证码；校验成功后立即失效。
}


message GetRestTokenResponse {
  string rest_token = 1;     //重置密码token 、失败返回空、有效期5分钟
}
