syntax = "proto3";

package starland;

option go_package = "github.com/ttufo101/api/starland;starland";

service Order {
  // 查询指定套餐当前可展示的支付方式；coming_soon 仅用于占位展示。
  rpc ListPaymentMethods (ListPaymentMethodsRequest) returns (ListPaymentMethodsResponse);

  // 创建订单及不可变支付信息；相同幂等键返回同一订单，新人套餐恢复唯一未完成订单。
  rpc CreateOrder (CreateOrderRequest) returns (OrderDetailResponse);

  // 查询当前登录用户的指定订单。
  rpc GetOrder (GetOrderRequest) returns (OrderDetailResponse);

  // 分页查询当前登录用户的订单列表。
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);

  // 接收支付渠道服务端通知；无需登录 Token，但必须通过渠道签名校验。
  rpc PaymentCallback (PaymentCallbackRequest) returns (PaymentCallbackResponse);
}

// 创建订单请求。
message CreateOrderRequest {
  string plan_id = 1;          // 要购买的套餐稳定业务 ID；价格与权益由服务端查询。
  string payment_method_id = 2;// 创建订单时锁定的支付方式；订单关闭前不可更换。
  string idempotency_key = 3;  // 客户端生成的幂等键；同一用户下最长 64 个字符。
}

message ListPaymentMethodsRequest {
  string plan_id = 1;
}

enum PaymentMethodStatus {
  PAYMENT_METHOD_STATUS_UNSPECIFIED = 0;
  PAYMENT_METHOD_STATUS_AVAILABLE = 1;
  PAYMENT_METHOD_STATUS_COMING_SOON = 2;
  PAYMENT_METHOD_STATUS_UNAVAILABLE = 3;
}

enum PaymentActionType {
  PAYMENT_ACTION_TYPE_UNSPECIFIED = 0;
  PAYMENT_ACTION_TYPE_CRYPTO_TRANSFER = 1;
  PAYMENT_ACTION_TYPE_REDIRECT = 2;
}

message PaymentMethod {
  string method_id = 1;
  string display_name = 2;
  PaymentMethodStatus status = 3;
  PaymentActionType action_type = 4;
  string network = 5;
  string token = 6;
  string icon_key = 7;
  string description = 8;
  int32 sort_order = 9;
}

message ListPaymentMethodsResponse {
  repeated PaymentMethod methods = 1;
}

// 查询单个订单请求。
message GetOrderRequest {
  string order_no = 1;  // 服务端生成的订单号。
}

// 分页查询订单请求。
message ListOrdersRequest {
  int32 page = 1;       // 页码，从 1 开始；小于 1 时按 1 处理。
  int32 page_size = 2;  // 每页数量，范围 1 至 100；非法值使用服务端默认值。
}

// 订单支付信息状态。每个订单在创建时即拥有唯一支付会话。
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_CREATING = 1;
  PAYMENT_STATUS_READY = 2;
  PAYMENT_STATUS_PAID = 4;
  PAYMENT_STATUS_EXPIRED = 5;
  PAYMENT_STATUS_CREATION_UNKNOWN = 6;
  PAYMENT_STATUS_MANUAL_REVIEW = 7;
  PAYMENT_STATUS_FAILED = 8;
}

message CryptoTransferAction {
  string amount = 1;          // 固定 USDT 实付数量，十进制字符串。
  string token = 2;           // 当前为 USDT。
  string network = 3;         // polygon、solana 或 tron。
  string receive_address = 4;
  string qr_payload = 5;      // 服务端确定的二维码原文；第一阶段等于收款地址。
}

message RedirectAction {
  string checkout_url = 1;
}

message PaymentInfo {
  string payment_method_id = 1;
  PaymentStatus status = 2;
  PaymentActionType action_type = 3;
  int64 payment_deadline_at = 4; // 付款操作截止时间，Unix 秒；支付信息本身不会重新生成。
  oneof action {
    CryptoTransferAction crypto_transfer = 10;
    RedirectAction redirect = 11;
  }

}

// epusdt 原始 JSON 通知；通过 Gateway 专用 HTTP 入口转发，Order 验签并持久化。
message PaymentCallbackRequest {
  string payload = 1;
}

// 支付回调处理结果。
message PaymentCallbackResponse {
  bool success = 1;  // 通知是否已验签并持久化；不代表权益已发放。
}

// 订单详情。
message OrderResponse {
  string order_no = 1;      // 服务端生成的订单号。
  string uid = 2;           // 订单所属用户 ID。
  string plan_id = 3;       // 购买的套餐稳定业务 ID。
  string plan_name = 4;     // 创建订单时保存的套餐名称快照。
  string plan_type = 5;     // 套餐类型：time 时间套餐，traffic 流量套餐。
  uint64 price_amount = 6;  // 订单金额，使用币种最小单位。
  string currency = 7;      // 订单币种，例如 CNY。
  string status = 8;        // 订单状态：paying、paid、success、fulfill_failed、refund_pending、closed 或 revoked（仅人工订单）。
  int64 paid_at = 9;        // 支付成功时间，未支付时为 0；Unix 秒级时间戳。
  int64 created_at = 10;    // 下单时间，Unix 秒。
  string payment_method_id = 11;   // 创建订单时锁定的稳定支付方式 ID。
  string payment_method_name = 12; // 创建订单时保存的展示名称快照。
  PaymentActionType payment_action_type = 13;
}

// 创建订单及查询订单详情共用的聚合响应。
message OrderDetailResponse {
  OrderResponse order = 1;
  PaymentInfo payment = 2;
  bool resumed_existing_order = 3; // 仅新人套餐恢复已有未完成订单时为 true。
}

// 订单列表只返回展示摘要，不包含地址、二维码或固定 USDT 金额。
message OrderSummary {
  string order_no = 1;
  string plan_name = 2;
  string plan_type = 3;
  uint64 price_amount = 4;
  string currency = 5;
  string payment_method_id = 6;
  string payment_method_name = 7;
  string status = 8;
  int64 created_at = 9;
}

message ListOrdersResponse {
  repeated OrderSummary orders = 1;  // 当前页订单，按 created_at、数据库主键倒序排列。
}
