syntax = "proto3";

package starland;

option go_package = "github.com/ttufo101/api/starland;starland";

service Order {
  // 为当前登录用户创建待支付套餐订单；相同幂等键返回同一订单。
  rpc CreateOrder (CreateOrderRequest) returns (OrderResponse);

  // 查询当前登录用户的指定订单。
  rpc GetOrder (GetOrderRequest) returns (OrderResponse);

  // 分页查询当前登录用户的订单列表。
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);

  // 同步创建并保存支付报价；正常直接返回 ready，重复调用读取同一报价。
  rpc CreatePayment (CreatePaymentRequest) returns (PaymentQuote);

  // 只读查询当前用户订单的报价；不创建报价、不预占资格、不延长截止时间。
  rpc GetPayment (GetPaymentRequest) returns (PaymentQuote);

  // 接收支付渠道服务端通知；无需登录 Token，但必须通过渠道签名校验。
  rpc PaymentCallback (PaymentCallbackRequest) returns (PaymentCallbackResponse);
}

// 创建订单请求。
message CreateOrderRequest {
  string plan_id = 1;          // 要购买的套餐稳定业务 ID；价格与权益由服务端查询。
  string idempotency_key = 2;  // 客户端生成的幂等键；同一用户下最长 64 个字符。
}

// 查询单个订单请求。
message GetOrderRequest {
  string order_no = 1;  // 服务端生成的订单号。
}

// 分页查询订单请求。
message ListOrdersRequest {
  int32 page = 1;       // 页码，从 1 开始；小于 1 时按 1 处理。
  int32 page_size = 2;  // 每页数量，范围 1 至 100；非法值使用服务端默认值。
}

// 创建支付请求。
message CreatePaymentRequest {
  string order_no = 1;         // 当前用户的待支付订单号。
  string payment_channel = 2;  // 支付渠道标识，目前仅 epusdt_polygon。
}

message GetPaymentRequest {
  string order_no = 1; // 当前用户的订单号。
}

// 创建和查询共用的支付报价。订单状态优先，非待支付订单不得继续付款。
message PaymentQuote {
  string order_no = 1;         // 对应的订单号。
  string payment_payload = 2;  // 完整收银台 HTTP(S) URL；仅 ready 且报价未过期时返回，其他状态为空。
  int64 expire_at = 3;         // 当前报价截止时间，Unix 秒；尚无报价时为 0。付款入口只使用本字段，不用 OrderResponse.expire_at 替代。
  // not_created/creating/ready/expired/creation_unknown/paid/manual_review。
  // not_created 和 creating 可由 GetPayment 返回；CreatePayment 正常同步返回 ready。
  // ready 报价在服务端当前时间 >= expire_at 时返回 expired，payment_payload 为空；
  // 重复调用只读取原报价，不重新创建或延期。已 paid 或 manual_review 不因时间变为 expired。
  string status = 4;
  string actual_amount = 5;    // 固定 USDT 实付数量，十进制字符串，禁止客户端重新报价。
  string receive_address = 6;
  string network = 7;          // polygon
  string token = 8;            // USDT

}

// epusdt 原始 JSON 通知；通过 Gateway 专用 HTTP 入口转发，Order 验签并持久化。
message PaymentCallbackRequest {
  string payload = 1;
}

// 支付回调处理结果。
message PaymentCallbackResponse {
  bool success = 1;  // 通知是否已验签并持久化；不代表权益已发放。
}

// 订单详情。
message OrderResponse {
  string order_no = 1;      // 服务端生成的订单号。
  string uid = 2;           // 订单所属用户 ID。
  string plan_id = 3;       // 购买的套餐稳定业务 ID。
  string plan_name = 4;     // 创建订单时保存的套餐名称快照。
  string plan_type = 5;     // 套餐类型：time 时间套餐，traffic 流量套餐。
  uint64 price_amount = 6;  // 订单金额，使用币种最小单位。
  string currency = 7;      // 订单币种，例如 CNY。
  string status = 8;        // 订单状态：pending、paying、paid、success、closed、fulfill_failed、refund_pending、refunded 或 revoked（仅人工订单）。
  int64 expire_at = 9;      // 订单截止时间，Unix 秒；创建订单时生成，保存渠道报价后同步为报价截止时间。客户端付款入口以 PaymentQuote.expire_at 为准。
  int64 paid_at = 10;       // 支付成功时间，未支付时为 0；Unix 秒级时间戳。
  int64 created_at = 11;    // 下单时间，Unix 秒。
}

// 订单列表响应。
message ListOrdersResponse {
  repeated OrderResponse orders = 1;  // 当前页订单，按 created_at、数据库主键倒序排列。
}
