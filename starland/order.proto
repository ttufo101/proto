syntax = "proto3";

package starland;

option go_package = "github.com/ttufo101/api/starland;starland";

service Order {
  // 查询指定套餐当前可展示的支付方式；coming_soon 仅用于占位展示。
  rpc ListPaymentMethods (ListPaymentMethodsRequest) returns (ListPaymentMethodsResponse);

  // 为当前登录用户创建待支付套餐订单；相同幂等键返回同一订单。
  rpc CreateOrder (CreateOrderRequest) returns (OrderResponse);

  // 查询当前登录用户的指定订单。
  rpc GetOrder (GetOrderRequest) returns (OrderResponse);

  // 分页查询当前登录用户的订单列表。
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);

  // 同步创建并保存支付报价；正常直接返回 ready，重复调用读取同一报价。
  rpc CreatePayment (CreatePaymentRequest) returns (PaymentQuote);

  // 只读查询当前用户订单的报价；不创建报价、不预占资格、不延长截止时间。
  rpc GetPayment (GetPaymentRequest) returns (PaymentQuote);

  // 接收支付渠道服务端通知；无需登录 Token，但必须通过渠道签名校验。
  rpc PaymentCallback (PaymentCallbackRequest) returns (PaymentCallbackResponse);
}

// 创建订单请求。
message CreateOrderRequest {
  string plan_id = 1;          // 要购买的套餐稳定业务 ID；价格与权益由服务端查询。
  string payment_method_id = 2;// 创建订单时锁定的支付方式；订单关闭前不可更换。
  string idempotency_key = 3;  // 客户端生成的幂等键；同一用户下最长 64 个字符。
}

message ListPaymentMethodsRequest {
  string plan_id = 1;
}

enum PaymentMethodStatus {
  PAYMENT_METHOD_STATUS_UNSPECIFIED = 0;
  PAYMENT_METHOD_STATUS_AVAILABLE = 1;
  PAYMENT_METHOD_STATUS_COMING_SOON = 2;
  PAYMENT_METHOD_STATUS_UNAVAILABLE = 3;
}

enum PaymentActionType {
  PAYMENT_ACTION_TYPE_UNSPECIFIED = 0;
  PAYMENT_ACTION_TYPE_CRYPTO_TRANSFER = 1;
  PAYMENT_ACTION_TYPE_REDIRECT = 2;
}

message PaymentMethod {
  string method_id = 1;
  string display_name = 2;
  PaymentMethodStatus status = 3;
  PaymentActionType action_type = 4;
  string network = 5;
  string token = 6;
  string icon_key = 7;
  string description = 8;
  int32 sort_order = 9;
}

message ListPaymentMethodsResponse {
  repeated PaymentMethod methods = 1;
}

// 查询单个订单请求。
message GetOrderRequest {
  string order_no = 1;  // 服务端生成的订单号。
}

// 分页查询订单请求。
message ListOrdersRequest {
  int32 page = 1;       // 页码，从 1 开始；小于 1 时按 1 处理。
  int32 page_size = 2;  // 每页数量，范围 1 至 100；非法值使用服务端默认值。
}

// 创建支付请求。
message CreatePaymentRequest {
  string order_no = 1; // 当前用户的待支付订单号；支付方式读取订单快照。
}

message GetPaymentRequest {
  string order_no = 1; // 当前用户的订单号。
}

// 创建和查询共用的支付报价。订单状态优先，非待支付订单不得继续付款。
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_NOT_CREATED = 1;
  PAYMENT_STATUS_CREATING = 2;
  PAYMENT_STATUS_READY = 3;
  PAYMENT_STATUS_PROCESSING = 4;
  PAYMENT_STATUS_PAID = 5;
  PAYMENT_STATUS_EXPIRED = 6;
  PAYMENT_STATUS_CREATION_UNKNOWN = 7;
  PAYMENT_STATUS_MANUAL_REVIEW = 8;
  PAYMENT_STATUS_FAILED = 9;
}

message CryptoTransferAction {
  string amount = 1;          // 固定 USDT 实付数量，十进制字符串。
  string token = 2;           // 当前为 USDT。
  string network = 3;         // polygon、solana 或 tron。
  string receive_address = 4;
  string qr_payload = 5;      // 服务端确定的二维码原文；第一阶段等于收款地址。
}

message RedirectAction {
  string checkout_url = 1;
}

message PaymentQuote {
  string order_no = 1;
  string payment_method_id = 2;
  PaymentStatus status = 3;
  int64 expire_at = 4;
  oneof action {
    CryptoTransferAction crypto_transfer = 10;
    RedirectAction redirect = 11;
  }

}

// epusdt 原始 JSON 通知；通过 Gateway 专用 HTTP 入口转发，Order 验签并持久化。
message PaymentCallbackRequest {
  string payload = 1;
}

// 支付回调处理结果。
message PaymentCallbackResponse {
  bool success = 1;  // 通知是否已验签并持久化；不代表权益已发放。
}

// 订单详情。
message OrderResponse {
  string order_no = 1;      // 服务端生成的订单号。
  string uid = 2;           // 订单所属用户 ID。
  string plan_id = 3;       // 购买的套餐稳定业务 ID。
  string plan_name = 4;     // 创建订单时保存的套餐名称快照。
  string plan_type = 5;     // 套餐类型：time 时间套餐，traffic 流量套餐。
  uint64 price_amount = 6;  // 订单金额，使用币种最小单位。
  string currency = 7;      // 订单币种，例如 CNY。
  string status = 8;        // 订单状态：pending、paying、paid、success、closed、fulfill_failed、refund_pending、refunded 或 revoked（仅人工订单）。
  int64 expire_at = 9;      // 订单截止时间，Unix 秒；创建订单时生成，保存渠道报价后同步为报价截止时间。客户端付款入口以 PaymentQuote.expire_at 为准。
  int64 paid_at = 10;       // 支付成功时间，未支付时为 0；Unix 秒级时间戳。
  int64 created_at = 11;    // 下单时间，Unix 秒。
  string payment_method_id = 12;   // 创建订单时锁定的稳定支付方式 ID。
  string payment_method_name = 13; // 创建订单时保存的展示名称快照。
  PaymentActionType payment_action_type = 14;
}

// 订单列表响应。
message ListOrdersResponse {
  repeated OrderResponse orders = 1;  // 当前页订单，按 created_at、数据库主键倒序排列。
}
